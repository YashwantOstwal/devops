name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test-package:
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn -B clean test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Lowercase repository owner
        run: |
          echo "OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/cicd-demo:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LOWER }}/cicd-demo:latest

  deploy-to-kubernetes:
    needs: build-test-package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: |
          echo "OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: 'v0.2.22'

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: 'my-devops-rg'
          cluster-name: 'my-aks-cluster'
          admin: 'false'
          use-kubelogin: 'true'

      - name: Update Kubernetes image
        run: |
          sed -i "s#IMAGE_NAME_PLACEHOLDER#ghcr.io/${{ env.OWNER_LOWER }}/cicd-demo:${{ github.sha }}#g" k8s/deployment.yaml
          kubectl apply -k k8s/
          kubectl rollout status deployment/cicd-demo -n cicd-demo --timeout=180s
          kubectl get pods -n cicd-demo
          kubectl get svc -n cicd-demo